name: Build BIXLINK Android APK
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: bun install
      - run: bun add -d @capacitor/cli@^8 @capacitor/android@^8
      - run: bunx cap add android
      - name: Add Firebase config
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Add GOOGLE_SERVICES_JSON repository secret"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: bunx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk bixlink.apk
      - uses: actions/upload-artifact@v4
        with: { name: bixlink-apk, path: bixlink.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          files: bixlink.apk
