name: Build BIXLINK Android APK
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Accept Android licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: bun install
      - run: bun add -d @capacitor/cli@^8 @capacitor/android@^8
      - run: bunx cap add android
      - name: Add Firebase config
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f native-android/google-services.json ]; then cp native-android/google-services.json android/app/google-services.json
          else echo "Add native-android/google-services.json or the GOOGLE_SERVICES_JSON secret"; exit 1; fi
      - name: BIXLINK fox app icon
        run: |
          curl -fsSL -o icon.png "https://bixlink.com/__l5e/assets-v1/c62ecff6-c5d1-4235-8e7a-e49c0c2b7039/fox-icon-512.png"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}; s=${d##*:}
            convert icon.png -resize ${s}x${s} $dir/ic_launcher.png
            convert icon.png -resize ${s}x${s} $dir/ic_launcher_round.png
            convert icon.png -resize $((s*9/4))x$((s*9/4)) -gravity center -background none -extent $((s*9/4))x$((s*9/4)) $dir/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Call permissions (lock-screen ringing)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in USE_FULL_SCREEN_INTENT WAKE_LOCK VIBRATE POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_PHONE_CALL; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          sed -i 's#<activity #<activity android:showWhenLocked="true" android:turnScreenOn="true" #' $M
      - run: bunx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk bixlink.apk
      - uses: actions/upload-artifact@v4
        with: { name: bixlink-apk, path: bixlink.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          files: bixlink.apk
