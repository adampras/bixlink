name: Build BIXLINK Android APK
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Accept Android licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: bun install
      - run: bun add -d @capacitor/cli@^8 @capacitor/android@^8
      - run: bunx cap add android
      - name: Add Firebase config
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f native-android/google-services.json ]; then cp native-android/google-services.json android/app/google-services.json
          else echo "Add native-android/google-services.json or the GOOGLE_SERVICES_JSON secret"; exit 1; fi
      - name: BIXLINK APK icon (gold fox, separate from PWA)
        run: |
          sudo apt-get install -y imagemagick > /dev/null || true
          cp native-android/icon.png icon.png
          R=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$R/mipmap-${d%%:*}; s=${d##*:}; f=$((s*9/4)); inner=$((f*60/100)); mkdir -p $dir
            convert icon.png -resize ${s}x${s} -background "#000000" -flatten $dir/ic_launcher.png
            convert -size ${s}x${s} xc:none -fill "#000000" -stroke "#FFD700" -strokewidth $((s/24+1)) -draw "circle $((s/2)),$((s/2)) $((s/2)),$((s/24+1))" \( icon.png -resize $((s*78/100))x$((s*78/100)) \) -gravity center -composite $dir/ic_launcher_round.png
            convert icon.png -resize ${inner}x${inner} -gravity center -background none -extent ${f}x${f} $dir/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26 $R/values
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n  <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/$n.xml
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#000000</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">BIXLINK</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">BIXLINK</string>#' $R/values/strings.xml
      - name: Call permissions (lock-screen ringing)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in USE_FULL_SCREEN_INTENT WAKE_LOCK VIBRATE POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_PHONE_CALL CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          grep -q "android.hardware.camera" $M || sed -i "s#</manifest>#    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n</manifest>#" $M
          sed -i 's#<activity #<activity android:showWhenLocked="true" android:turnScreenOn="true" #' $M
      - run: bunx cap sync android
      - name: Camera & microphone for QR scanner and BIX CALL
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(head -1 "$F")
          cat > "$F" <<JAVA
          $PKG
          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          public class MainActivity extends BridgeActivity {
            private long lastBack = 0;
            @Override public void onBackPressed() {
              WebView w = getBridge().getWebView();
              String u = w.getUrl() == null ? "" : w.getUrl();
              String path = u.replaceFirst("^https?://[^/]+", "").split("[?#]")[0];
              boolean home = path.isEmpty() || path.equals("/");
              if (w.canGoBack()) { w.goBack(); return; }
              if (!home) { w.loadUrl("https://bixlink.com/"); return; }
              long now = System.currentTimeMillis();
              if (now - lastBack < 2000) { finish(); return; }
              lastBack = now;
              Toast.makeText(this, "Tekan sekali lagi untuk keluar dari BIXLINK", Toast.LENGTH_SHORT).show();
            }
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              // Incoming BIX CALL: light up the screen and draw the answer/decline card over the lock screen.
              if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              requestPermissions(new String[]{ Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO }, 7);
              getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override public void onPermissionRequest(final PermissionRequest r) { runOnUiThread(() -> r.grant(r.getResources())); }
              });
            }
          }
          JAVA
          sed -i 's/^          //' "$F"; cat "$F"
      - name: Native BIX CALL banner (Jawab / Tolak, lock screen)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1); D=$(dirname "$F")
          PKG=$(head -1 "$F")
          cat > "$D/BixCallService.java" <<'JAVA'
          __PKG__
          import android.app.*;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          public class BixCallService extends com.capacitorjs.plugins.pushnotifications.MessagingService {
            static final String CH = "bixcall_ring_v2";
            @Override public void onMessageReceived(RemoteMessage m) {
              Map<String, String> d = m.getData();
              if (!"call".equals(d.get("type")) || d.get("callId") == null) { super.onMessageReceived(m); return; }
              try { if (Long.parseLong(d.get("expiresAt")) < System.currentTimeMillis()) return; } catch (Exception e) { }
              String id = d.get("callId");
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              Uri tone = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel c = new NotificationChannel(CH, "BIX CALL panggilan masuk", NotificationManager.IMPORTANCE_HIGH);
                c.setSound(tone, new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                c.enableVibration(true); c.setVibrationPattern(new long[]{0, 900, 700, 900, 700, 900});
                c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC); c.setBypassDnd(true);
                nm.createNotificationChannel(c);
              }
              int nid = id.hashCode();
              NotificationCompat.Builder b = new NotificationCompat.Builder(this, CH)
                .setSmallIcon(getApplicationInfo().icon)
                .setContentTitle(d.get("title") == null ? "BIX CALL" : d.get("title"))
                .setContentText("video".equals(d.get("kind")) ? "Panggilan video masuk" : "Panggilan suara masuk")
                .setPriority(NotificationCompat.PRIORITY_MAX).setCategory(NotificationCompat.CATEGORY_CALL)
                .setVisibility(NotificationCompat.VISIBILITY_PUBLIC).setOngoing(true).setAutoCancel(true)
                .setSound(tone).setVibrate(new long[]{0, 900, 700, 900}).setTimeoutAfter(75000)
                .setColor(0xFFFFD700).setColorized(true)
                .setContentIntent(open(id, "show", 1)).setFullScreenIntent(open(id, "show", 1), true)
                .addAction(0, "Tolak", open(id, "decline", 2))
                .addAction(0, "Jawab", open(id, "answer", 3));
              Notification n = b.build(); n.flags |= Notification.FLAG_INSISTENT;
              nm.notify("call-" + id, nid, n);
            }
            PendingIntent open(String id, String act, int req) {
              Intent i = new Intent(this, MainActivity.class).setAction("bixcall." + act)
                .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP)
                .putExtra("bixcallId", id).putExtra("bixcallAct", act);
              return PendingIntent.getActivity(this, id.hashCode() * 4 + req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }
          }
          JAVA
          sed -i 's/^          //' "$D/BixCallService.java"; sed -i "s#__PKG__#$PKG#" "$D/BixCallService.java"
          # MainActivity: route banner taps to the web call screen and clear the ringing banner.
          python3 - "$F" <<'PY'
          import sys; p=sys.argv[1]; s=open(p).read()
          hook = """  @Override protected void onNewIntent(android.content.Intent i) { super.onNewIntent(i); bixCall(i); }
            void bixCall(android.content.Intent i) {
              String id = i == null ? null : i.getStringExtra("bixcallId"); if (id == null) return;
              String act = i.getStringExtra("bixcallAct"); i.removeExtra("bixcallId");
              ((android.app.NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancel("call-" + id, id.hashCode());
              String q = "show".equals(act) ? "" : "?bixcall=" + act + "&id=" + id;
              getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl("https://bixlink.com/call" + q));
            }
            @Override public void onCreate(Bundle b) {"""
          s = s.replace("  @Override public void onCreate(Bundle b) {", hook, 1)
          s = s.replace("requestPermissions(new String[]{", "bixCall(getIntent());\n    requestPermissions(new String[]{", 1)
          open(p,'w').write(s)
          PY
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i '0,/<manifest /s#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          sed -i 's#</application>#    <service android:name=".BixCallService" android:exported="false"><intent-filter android:priority="10"><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>\n        <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n    </application>#' $M
          sed -i 's#<activity #<activity android:launchMode="singleTask" #' $M
          G=android/app/build.gradle
          grep -q "com.google.gms.google-services" $G || echo "apply plugin: 'com.google.gms.google-services'" >> $G
          # BixCallService uses Firebase + Capacitor push classes directly: the app module must compile against them.
          printf '\ndependencies {\n    implementation "com.google.firebase:firebase-messaging:24.1.0"\n    implementation "androidx.core:core:1.13.1"\n    implementation project(":capacitor-push-notifications")\n}\n' >> $G
          grep -q "classpath 'com.google.gms:google-services" android/build.gradle || sed -i "0,/dependencies {/s##dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          tail -20 $G
          cat $M
      - name: Release keystore (from secrets, or create BIXLINK key once)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > bixlink-release.jks
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV; echo "NEW_KEY=0" >> $GITHUB_ENV
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore bixlink-release.jks -alias bixlink -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=BIXLINK Global Technologies, OU=Mobile, O=BIXLINK, L=Mataram, ST=NTB, C=ID"
            mkdir -p keystore-save; base64 -w0 bixlink-release.jks > keystore-save/ANDROID_KEYSTORE_BASE64.txt
            echo "$P" > keystore-save/ANDROID_KEYSTORE_PASSWORD.txt
            echo "KS_PASS=$P" >> $GITHUB_ENV; echo "NEW_KEY=1" >> $GITHUB_ENV
            echo "::warning::New BIXLINK signing key created. Download the 'bixlink-signing-key' artifact and save both values as repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, so future APKs can update existing installs."
          fi
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew && ./gradlew assembleRelease --stacktrace
          B=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$B/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $ANDROID_HOME/build-tools/$B/apksigner sign --ks ../bixlink-release.jks --ks-key-alias bixlink \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out ../bixlink.apk aligned.apk
          $ANDROID_HOME/build-tools/$B/apksigner verify --print-certs ../bixlink.apk
      - if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with: { name: bixlink-signing-key, path: keystore-save, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: bixlink-apk, path: bixlink.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          files: bixlink.apk
